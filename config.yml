data:
  outfits_path: './data/tabular/outfit_data.csv'
  products_path: './data/tabular/product_data.csv'
  valid_outfits_path: './data/processed/valid_outfits.csv'
  outfits_w_products_path: './data/processed/outfit_w_products.csv'


  configurations_base:
    - - 'Dresses, jumpsuits and Complete set'
      - 'Footwear'
      - 'Earrings'
    - - 'Tops'
      - 'Bottoms'
      - 'Footwear'
      - 'Earrings'

  optional_products:
    - 'Outerwear'
    - 'Bags'
    - 'Glasses'
    - 'Ring'
    - 'Necklace'

  image_height: 128
  image_width: 96

training:
  train_dataset_path: './data/processed/train_dataset.tfrecord'
  train_sample_path: './data/processed/train_sample.tfrecord'
  epoch_images_path: './figures/epoch_images_256'
  model_weights_path: './models/vae_256.weights.h5'
  model_data_path: './models/vae_data_256.pkl'
  train_sample_indices:
    - 45
    - 28
    - 896
    - 912
  batch_size: 32
  epochs: 400
  learning_rate: 0.0001
  seed: 42
  checkpoint_every: 20

generation:
  generated_outfits_path: './data/processed/generated_outfits.csv'
  candidate_embeddings_path: './data/processed/candidate_embeddings.npy'
  candidate_pool: 'unseen'  # unseen | seen | all products as candidate material
  num_candidates: 100000
  encode_batch_size: 32
  match_training_jpeg: true  # round-trip candidates through JPEG like training records
  top_k: 3
  seed: 42
